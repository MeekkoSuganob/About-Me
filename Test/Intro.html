        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        /* Headings styling */
        h1 {
            color: #38bdf8;
            font-size: 1.2rem;

            color: #f1f5f9;
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 20px;
        }

        /* Paragraph styling */
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #cbd5e1;
        }

</head>
<body>

    <h1>Name</h1>
